on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: get the latest stable manifest
        # docker buildx authenticates to ghcr.io via the GITHUB_TOKEN env
        # var automatically. the plain curl approach broke when ghcr started
        # resetting http/2 streams ( curl 43, see github community
        # discussion 196959 ).
        run: docker buildx imagetools inspect --raw ghcr.io/home-assistant/home-assistant:stable | python -m json.tool > stable.json
      - name: set github user name
        run: git config user.name "GitHub Actions [Bot]"
      - name: set github user email
        run: git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: check for changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
              git add .
              git commit -m "updated stable manifest"
              git push
          fi
